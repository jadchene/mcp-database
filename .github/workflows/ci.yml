name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mcp_test
          MYSQL_USER: mcp
          MYSQL_PASSWORD: mcp-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcp_test
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mcp -d mcp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_DATABASE: mcp_test
      TEST_MYSQL_USER: mcp
      TEST_MYSQL_PASSWORD: mcp-test-password
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_DATABASE: mcp_test
      TEST_POSTGRES_USER: mcp
      TEST_POSTGRES_PASSWORD: mcp-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:package
      - run: npm audit --omit=dev
